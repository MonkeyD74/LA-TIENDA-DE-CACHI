<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>La Tienda de Cachi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f3f6ff;color:#111;padding-bottom:80px}
header{background:#0D47A1;color:white;padding:14px}
.logo{color:#FFC107;font-size:22px;font-weight:900}
.search{display:flex;gap:8px;margin-top:10px}
.search input{flex:1;padding:12px;border-radius:10px;border:0;font-size:16px}
.search button{background:#FFC107;color:#0D47A1;border:0;border-radius:10px;padding:12px;font-weight:900}
.banner{background:#CC1A1A;color:white;text-align:center;padding:10px;font-weight:800}
.hero{height:110px;background:#FFC107;display:flex;align-items:end;justify-content:center;font-size:55px}
.tabs{display:flex;gap:8px;overflow:auto;padding:10px;background:white}
.tabs button{border:0;border-radius:999px;padding:10px 14px;font-weight:800;background:#e8eefc;color:#0D47A1;white-space:nowrap}
.tabs button.active{background:#0D47A1;color:white}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
.card{background:white;border:2px solid #e65100;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #0001}
.img{height:120px;background:#fff6f0;display:flex;align-items:center;justify-content:center;font-size:45px}
.card-body{padding:10px}
.name{font-weight:900;font-size:15px;min-height:38px}
.stock{display:inline-block;background:#ffe2e2;color:#b00020;border-radius:999px;padding:4px 8px;font-size:12px;margin:6px 0}
.price{color:#e65100;font-size:22px;font-weight:900}
.reward{background:#fff3cd;margin:12px;padding:14px;border-radius:14px}
.reward h2{margin-bottom:8px}
.reward input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin:8px 0;font-size:16px}
.reward button{width:100%;padding:12px;background:#0D47A1;color:white;border:0;border-radius:10px;font-weight:900}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:9px 4px;box-shadow:0 -3px 12px #0003;z-index:9999}
.bottom button{border:0;background:white;color:#0D47A1;font-weight:900;font-size:12px}
.floating{position:fixed;left:12px;bottom:62px;background:#0D47A1;color:white;border:0;border-radius:999px;padding:12px 16px;font-weight:900;z-index:9999}
.loading{text-align:center;padding:25px;font-weight:900}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}.hero{height:150px}}
</style>
</head>
<body>

<header>
  <div class="logo">La Tienda de Cachi</div>
  <div id="total">Cargando productos...</div>
  <div class="search">
    <input id="buscar" placeholder="Buscar productos...">
    <button onclick="buscarProductos()">Buscar</button>
  </div>
</header>

<div class="banner">La Tienda de Cachi - Siempre cerca de ti</div>
<div class="hero">🐶</div>

<section class="reward" id="recompensas">
  <h2>🎁 Recompensas</h2>
  <p>Acumula 1 centavo por cada $1 peso comprado.</p>
  <input id="telefonoReward" placeholder="Tu número de teléfono">
  <button onclick="consultarRecompensa()">Revisar mi crédito</button>
  <div id="resultadoReward" style="margin-top:10px;font-weight:900"></div>
</section>

<div class="tabs" id="categorias"></div>
<div id="estado" class="loading">Cargando catálogo...</div>
<div class="grid" id="productos"></div>

<button class="floating" onclick="window.scrollTo({top:0,behavior:'smooth'})">← Inicio</button>

<nav class="bottom">
  <button onclick="window.scrollTo({top:0,behavior:'smooth'})">🏠 Inicio</button>
  <button onclick="mostrarCategorias()">📂 Categorías</button>
  <button onclick="document.getElementById('buscar').focus()">🔍 Buscar</button>
  <button onclick="document.getElementById('recompensas').scrollIntoView({behavior:'smooth'})">🎁 Recompensas</button>
</nav>

<script>
let allProducts=[];
let currentCat='Todos';

function money(n){return '$'+Number(n||0).toFixed(2)}

function card(p){
  const img=p.imagen
    ? `<img loading="lazy" src="${p.imagen}" style="width:100%;height:100%;object-fit:contain" onerror="this.replaceWith(document.createTextNode('🛒'))">`
    : '🛒';
  return `
    <div class="card">
      <div class="img">${img}</div>
      <div class="card-body">
        <div class="name">${p.nombre||'Producto'}</div>
        ${(Number(p.stock||0)<=0)?'<div class="stock">Sin stock</div>':'<div class="stock">En stock</div>'}
        <div class="price">${money(p.precio)}</div>
      </div>
    </div>`;
}

function renderCategorias(){
  const cats=['Todos',...new Set(allProducts.map(p=>p.cat||'Sin categoría'))].sort();
  document.getElementById('categorias').innerHTML=cats.map(cat=>{
    const count=cat==='Todos'?allProducts.length:allProducts.filter(p=>(p.cat||'Sin categoría')===cat).length;
    return `<button class="${cat===currentCat?'active':''}" onclick="abrirCat('${cat.replace(/'/g,"\\'")}')">${cat} (${count})</button>`;
  }).join('');
}

function abrirCat(cat){
  currentCat=cat;
  document.getElementById('buscar').value='';
  renderCategorias();
  const lista=cat==='Todos'?allProducts:allProducts.filter(p=>(p.cat||'Sin categoría')===cat);
  document.getElementById('estado').textContent=lista.length+' productos';
  document.getElementById('productos').innerHTML=lista.slice(0,60).map(card).join('');
}

function buscarProductos(){
  const q=document.getElementById('buscar').value.toLowerCase().trim();
  if(!q){abrirCat(currentCat);return}
  const lista=allProducts.filter(p=>(p.nombre||'').toLowerCase().includes(q));
  document.getElementById('estado').textContent=lista.length+' resultados';
  document.getElementById('productos').innerHTML=lista.slice(0,80).map(card).join('');
}

function mostrarCategorias(){
  document.getElementById('categorias').scrollIntoView({behavior:'smooth'});
}

async function consultarRecompensa(){
  const phone=document.getElementById('telefonoReward').value.trim();
  const box=document.getElementById('resultadoReward');
  if(!phone){box.textContent='Escribe tu número.';return}
  box.textContent='Consultando...';
  try{
    const res=await fetch('/api/recompensas?phone='+encodeURIComponent(phone));
    const data=await res.json();
    if(!data.encontrado){
      box.innerHTML='❌ '+(data.mensaje||'No encontrado');
      return;
    }
    box.innerHTML=
      '👤 '+data.nombre+'<br>'+
      '💵 Gastado: '+money(data.gastado)+'<br>'+
      '🎁 Crédito disponible: '+money(data.credito);
  }catch(e){
    box.textContent='Error consultando recompensas.';
  }
}

async function cargar(){
  try{
    const res=await fetch('/api/productos');
    const data=await res.json();
    allProducts=data.productos||[];
    document.getElementById('total').textContent=allProducts.length+' productos';
    renderCategorias();
    abrirCat('Todos');
  }catch(e){
    document.getElementById('estado').textContent='Error cargando productos.';
  }
}

document.getElementById('buscar').addEventListener('input',buscarProductos);
cargar();
</script>

</body>
</html>
