<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>La Tienda de Cachi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial,sans-serif;background:#f0f4ff;padding-bottom:72px;}
#fw-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;}
.header{background:#0D47A1;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200;}
.logo-txt{color:#FFC107;font-size:1.1rem;font-weight:900;}
.logo-sub{color:rgba(255,255,255,0.8);font-size:0.65rem;}
.search-wrap{flex:1;display:flex;gap:8px;}
.search-wrap input{flex:1;padding:8px 12px;border-radius:6px;border:none;font-size:0.85rem;}
.search-wrap button{padding:8px 14px;background:#FFC107;color:#0D47A1;border:none;border-radius:6px;font-weight:900;cursor:pointer;}
.banner{background:#CC1A1A;color:white;text-align:center;padding:7px;font-size:0.78rem;font-weight:700;}
.avatar-section{background:#FFC107;height:115px;position:relative;overflow:hidden;border-bottom:4px solid #E65100;}
.piso-line{position:absolute;bottom:0;left:0;right:0;height:5px;background:rgba(180,90,0,0.3);}
#perritoGif{position:absolute;bottom:0;height:108px;width:auto;cursor:pointer;filter:drop-shadow(3px 0 6px rgba(0,0,0,0.15)) drop-shadow(0 0 3px #FFC107) drop-shadow(0 0 3px #FFC107);}
.avatar-bubble{position:absolute;top:8px;background:white;border-radius:12px 12px 12px 4px;padding:6px 12px;font-size:12px;font-weight:700;color:#0D47A1;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.15);opacity:0;transition:opacity 0.3s;pointer-events:none;}
.main-layout{display:flex;min-height:calc(100vh - 200px);}
.sidebar{width:220px;background:white;border-right:2px solid #e0e0e0;position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;flex-shrink:0;padding-bottom:80px;}
.sidebar-title{background:#0D47A1;color:white;padding:10px 14px;font-size:0.82rem;font-weight:900;}
.sidebar-list{list-style:none;}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background 0.15s;}
.sidebar-item:hover{background:#f0f4ff;}
.sidebar-item.active{background:#e3f2fd;border-left:4px solid #0D47A1;}
.sidebar-item-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
.sidebar-item-name{font-size:0.78rem;font-weight:700;color:#1a1a2e;line-height:1.2;}
.sidebar-item-count{font-size:0.62rem;color:#888;}
.content{flex:1;padding:14px;max-width:1200px;}
.menu-titulo{font-size:1rem;font-weight:900;color:#0D47A1;margin-bottom:12px;padding-left:10px;border-left:4px solid #CC1A1A;}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.menu-card{background:white;border-radius:12px;border-width:3px;border-style:solid;overflow:hidden;cursor:pointer;transition:transform 0.15s;text-align:center;}
.menu-card:hover{transform:translateY(-3px);}
.menu-card-icon{font-size:2.5rem;padding:18px 0 10px;}
.menu-card-name{font-size:0.82rem;font-weight:900;color:#1a1a2e;padding:0 8px;margin-bottom:4px;}
.menu-card-count{font-size:0.68rem;color:#888;padding:0 8px 12px;}
.cat-header{background:#0D47A1;color:white;padding:10px 16px;display:flex;align-items:center;gap:10px;border-radius:8px;margin-bottom:12px;}
.btn-back{background:#FFC107;color:#0D47A1;border:none;padding:6px 14px;border-radius:20px;font-weight:900;font-size:0.82rem;cursor:pointer;}
.cat-header-txt{font-size:1rem;font-weight:900;}.cat-header-sub{font-size:0.72rem;opacity:0.8;}
.filtro-stock{display:flex;gap:8px;padding:8px 0;align-items:center;font-size:0.78rem;margin-bottom:8px;}
.filtro-stock label{color:#444;cursor:pointer;display:flex;align-items:center;gap:4px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;}
.card{background:white;border-radius:10px;overflow:hidden;border-width:3px;border-style:solid;transition:transform 0.15s;cursor:pointer;}
.card:hover{transform:translateY(-2px);}
.card-img{height:110px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;overflow:hidden;}
.card-img img{max-width:90%;max-height:100px;object-fit:contain;}
.card-body{padding:8px 9px;}
.card-name{font-size:0.78rem;font-weight:700;color:#1a1a2e;margin-bottom:3px;line-height:1.3;}
.stock{display:inline-block;font-size:0.65rem;font-weight:700;padding:2px 7px;border-radius:6px;margin-bottom:5px;}
.stock-ok{background:#e8f5e9;color:#2E7D32;}.stock-low{background:#fff8e1;color:#F57F17;}.stock-out{background:#ffebee;color:#B71C1C;}
.card-price{font-size:1rem;font-weight:900;}
.contact-bar{position:fixed;bottom:0;left:0;right:0;z-index:500;display:flex;gap:10px;background:#1a1a2e;padding:10px 16px;box-shadow:0 -3px 16px rgba(0,0,0,0.35);}
.contact-bar a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:10px;font-weight:900;font-size:0.9rem;text-decoration:none;color:white;}
.cwa{background:#25D366;}.ctel{background:#0D47A1;}
.no-res{text-align:center;padding:40px;color:#888;font-size:0.9rem;}
.hidden{display:none!important;}
.loading{text-align:center;padding:60px;color:#0D47A1;}
.loading-spin{display:inline-block;width:40px;height:40px;border:4px solid #ddd;border-top:4px solid #0D47A1;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px;}
@keyframes spin{to{transform:rotate(360deg)}}
.timestamp{text-align:center;font-size:0.65rem;color:#aaa;padding:8px;background:#f8f8f8;}
@media(max-width:768px){
.main-layout{flex-direction:column;}
.sidebar{width:100%;height:auto;position:relative;top:0;overflow-x:auto;overflow-y:hidden;padding-bottom:0;border-right:none;border-bottom:2px solid #e0e0e0;}
.sidebar-title{display:none;}
.sidebar-list{display:flex;overflow-x:auto;padding:6px 8px;gap:6px;}
.sidebar-item{flex-direction:column;padding:6px 10px;min-width:70px;text-align:center;border-bottom:none;border-radius:8px;white-space:normal;}
.sidebar-item.active{border-left:none;border-bottom:3px solid #0D47A1;}
.sidebar-item-icon{width:32px;height:32px;font-size:1rem;margin:0 auto;}
.sidebar-item-name{font-size:0.65rem;}
.sidebar-item-count{display:none;}
.content{padding:10px;}
.menu-grid,.grid{grid-template-columns:repeat(2,1fr);}
.logo-txt{font-size:0.95rem;}
.contact-bar a{font-size:0.82rem;padding:11px 6px;}}
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:9998;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:8px 4px;
  box-shadow:0 -3px 12px rgba(0,0,0,.18);
}
.bottom-nav button{
  border:0;
  background:transparent;
  font-size:.72rem;
  font-weight:800;
  color:#0D47A1;
}
.btn-regresar{
  position:fixed;
  left:12px;
  bottom:58px;
  z-index:9999;
  background:#0D47A1;
  color:white;
  border:0;
  border-radius:999px;
  padding:10px 14px;
  font-weight:900;
  box-shadow:0 4px 14px rgba(0,0,0,.25);
}
body{
  padding-bottom:70px;
}
</style>
</head>

var COLORES={"Abarrotes":{borde:"#E65100",fondo:"#fff8f5",precio:"#E65100",bg:"#E65100"},"refrescos y jugos":{borde:"#0D47A1",fondo:"#f0f4ff",precio:"#0D47A1",bg:"#0D47A1"},"Refrescos y Jugos":{borde:"#0D47A1",fondo:"#f0f4ff",precio:"#0D47A1",bg:"#0D47A1"},"Pan y Galletas":{borde:"#795548",fondo:"#fdf6f0",precio:"#795548",bg:"#795548"},"Galletas":{borde:"#795548",fondo:"#fdf6f0",precio:"#795548",bg:"#795548"},"Botanas":{borde:"#CC1A1A",fondo:"#fff5f5",precio:"#CC1A1A",bg:"#CC1A1A"},"Comida Chatarra":{borde:"#CC1A1A",fondo:"#fff5f5",precio:"#CC1A1A",bg:"#CC1A1A"},"Dulces":{borde:"#E91E8C",fondo:"#fff0f8",precio:"#C2185B",bg:"#E91E8C"},"Lacteos y Embutidos":{borde:"#F9A825",fondo:"#fffbf0",precio:"#c67c00",bg:"#F9A825"},"Detergentes":{borde:"#6A1B9A",fondo:"#f8f0ff",precio:"#6A1B9A",bg:"#6A1B9A"},"Cuidado Personal":{borde:"#6A1B9A",fondo:"#f8f0ff",precio:"#6A1B9A",bg:"#6A1B9A"},"Bebidas Alcoholicas":{borde:"#D4AF37",fondo:"#fffdf0",precio:"#8B6914",bg:"#B8860B"},"Salud":{borde:"#00796B",fondo:"#f0faf8",precio:"#00796B",bg:"#00796B"},"Frutas y Verduras":{borde:"#2E7D32",fondo:"#f1f8f1",precio:"#2E7D32",bg:"#2E7D32"},"Cigarros":{borde:"#546E7A",fondo:"#f5f7f8",precio:"#546E7A",bg:"#546E7A"},"Helados":{borde:"#039BE5",fondo:"#f0f9ff",precio:"#0277BD",bg:"#039BE5"},"Carnes":{borde:"#B71C1C",fondo:"#fff5f5",precio:"#B71C1C",bg:"#B71C1C"},"Tortillas":{borde:"#F57F17",fondo:"#fffde7",precio:"#F57F17",bg:"#F57F17"},"Mascotas":{borde:"#558B2F",fondo:"#f4f8f0",precio:"#558B2F",bg:"#558B2F"},"Cafe":{borde:"#4E342E",fondo:"#fdf6f0",precio:"#4E342E",bg:"#4E342E"},"Sin categoria":{borde:"#888",fondo:"#f5f5f5",precio:"#555",bg:"#888"}};
var EMOJIS={"Abarrotes":"\u{1F6D2}","refrescos y jugos":"\u{1F964}","Refrescos y Jugos":"\u{1F964}","Pan y Galletas":"\u{1F35E}","Galletas":"\u{1F36A}","Botanas":"\u{1F35F}","Comida Chatarra":"\u{1F354}","Dulces":"\u{1F36C}","Lacteos y Embutidos":"\u{1F95B}","Detergentes":"\u{1F9FC}","Cuidado Personal":"\u{1FAA5}","Bebidas Alcoholicas":"\u{1F37A}","Salud":"\u{1F48A}","Frutas y Verduras":"\u{1F966}","Cigarros":"\u{1F6AC}","Helados":"\u{1F366}","Carnes":"\u{1F969}","Tortillas":"\u{1FAD3}","Mascotas":"\u{1F43E}","Cafe":"\u2615","Sin categoria":"\u{1F4E6}"};
function getColor(c){return COLORES[c]||COLORES["Sin categoria"];}
function getEmoji(c){return EMOJIS[c]||"\u{1F4E6}";}
function stockBadge(s){if(s>10)return "<span class='stock stock-ok'>En stock ("+s+")</span>";if(s>0)return "<span class='stock stock-low'>Ultimas "+s+"</span>";return "<span class='stock stock-out'>Sin stock</span>";}
function imgError(el){el.style.display="none";el.nextElementSibling.style.display="block";}
function cardHTML(p){var c=getColor(p.cat);var emoji=getEmoji(p.cat);var img="";if(p.imagen&&p.imagen.length>5){img="<img src='"+p.imagen+"' onload=\"this.style.display='inline';this.nextElementSibling.style.display='none'\" onerror=\"imgError(this)\" style='display:none'><span style='display:block'>"+emoji+"</span>";}else{img="<span>"+emoji+"</span>";}return "<div class='card' style='border-color:"+c.borde+"'><div class='card-img' style='background:"+c.fondo+"'>"+img+"</div><div class='card-body'><div class='card-name'>"+p.nombre+"</div>"+stockBadge(p.stock)+"<div class='card-price' style='color:"+c.precio+"'>$"+p.precio.toFixed(2)+"</div></div></div>";}
async function cargarProductos(){try{var res=await fetch("/api/productos");var data=await res.json();allProducts=data.productos;document.getElementById("totalSub").textContent=data.total+" productos";document.getElementById("timestamp").textContent="Actualizado: "+new Date(data.timestamp).toLocaleString("es-MX");document.getElementById("timestamp").classList.remove("hidden");catsData={};allProducts.forEach(function(p){if(!catsData[p.cat])catsData[p.cat]=[];catsData[p.cat].push(p);});renderSidebar();renderMenu();document.getElementById("loading").classList.add("hidden");document.getElementById("mainLayout").classList.remove("hidden");}catch(e){document.getElementById("loading").innerHTML="<div style='color:#CC1A1A'>Error cargando productos.</div>";}}
function renderSidebar(){var sortedCats=Object.keys(catsData).sort();var list=document.getElementById("sidebarList");list.innerHTML="<li class='sidebar-item active' data-cat='Todos' onclick='clickSidebar(this,\"Todos\")'><div class='sidebar-item-icon' style='background:#0D47A1'>\u{1F3E0}</div><div><div class='sidebar-item-name'>Todos</div><div class='sidebar-item-count'>"+allProducts.length+" productos</div></div></li>";sortedCats.forEach(function(cat){var c=getColor(cat);var disp=catsData[cat].filter(function(p){return p.stock>0;}).length;list.innerHTML+="<li class='sidebar-item' data-cat='"+cat+"' onclick='clickSidebar(this,\""+cat.replace(/"/g,"")+"\")'><div class='sidebar-item-icon' style='background:"+c.bg+"'>"+getEmoji(cat)+"</div><div><div class='sidebar-item-name'>"+cat+"</div><div class='sidebar-item-count'>"+catsData[cat].length+" - "+disp+" disp</div></div></li>";});}
function clickSidebar(el,cat){document.querySelectorAll(".sidebar-item").forEach(function(i){i.classList.remove("active");});el.classList.add("active");if(cat==="Todos"){volverMenu();}else{openCat(cat);}}
function renderMenu(){var mg=document.getElementById("menuGrid");mg.innerHTML="";Object.keys(catsData).sort().forEach(function(cat){var c=getColor(cat);var prods=catsData[cat];var disp=prods.filter(function(p){return p.stock>0;}).length;mg.innerHTML+="<div class='menu-card' onclick='openCat(\""+cat.replace(/"/g,"")+"\")' style='border-color:"+c.borde+"'><div class='menu-card-icon' style='background:"+c.bg+"'>"+getEmoji(cat)+"</div><div class='menu-card-name'>"+cat+"</div><div class='menu-card-count'>"+prods.length+" - "+disp+" disponibles</div></div>";});}
function openCat(cat){document.getElementById("menu-principal").classList.add("hidden");document.getElementById("busqueda-wrap").classList.add("hidden");document.getElementById("cat-content").classList.remove("hidden");var prods=catsData[cat]||[];document.getElementById("cat-header-txt").textContent=getEmoji(cat)+" "+cat;document.getElementById("cat-header-sub").textContent=prods.length+" productos";document.getElementById("cat-grid").innerHTML=prods.map(cardHTML).join("");document.getElementById("soloDisponibles").checked=false;catActiva=cat;document.getElementById("buscar").value="";document.querySelectorAll(".sidebar-item").forEach(function(i){i.classList.toggle("active",i.dataset.cat===cat);});window.scrollTo(0,0);}
function volverMenu(){document.getElementById("cat-content").classList.add("hidden");document.getElementById("busqueda-wrap").classList.add("hidden");document.getElementById("menu-principal").classList.remove("hidden");document.getElementById("buscar").value="";catActiva=null;document.querySelectorAll(".sidebar-item").forEach(function(i){i.classList.toggle("active",i.dataset.cat==="Todos");});window.scrollTo(0,0);}
function filtrarCat(){if(!catActiva)return;var s=document.getElementById("soloDisponibles").checked;document.querySelectorAll("#cat-grid .card").forEach(function(c){c.classList.toggle("hidden",s&&c.querySelector(".stock-out")!==null);});}
function buscarGlobal(){var q=document.getElementById("buscar").value.toLowerCase().trim();if(!q){volverMenu();return;}document.getElementById("menu-principal").classList.add("hidden");document.getElementById("cat-content").classList.add("hidden");var res=allProducts.filter(function(p){return p.nombre.toLowerCase().indexOf(q)>=0;});document.getElementById("busqueda-grid").innerHTML=res.map(cardHTML).join("");document.getElementById("busqueda-titulo").textContent=res.length+" resultados";document.getElementById("no-res-busq").classList.toggle("hidden",res.length>0);document.getElementById("busqueda-wrap").classList.remove("hidden");document.querySelectorAll(".sidebar-item").forEach(function(i){i.classList.remove("active");});}
var perrito=document.getElementById("perritoGif");var section=document.getElementById("avatarSection");var bubble=document.getElementById("avatarBubble");var px=0,dir=1,gifIdx=0,lastBark=-1;var frases=["Guau!","Woof!","Hola!","Arf!"];perrito.src=GIF_FRAMES[0];function walk(){var mx=section.offsetWidth-170;px+=dir*3.5;if(px>=mx){px=mx;dir=-1;perrito.style.transform="scaleX(-1)";}if(px<=0){px=0;dir=1;perrito.style.transform="scaleX(1)";}perrito.style.left=px+"px";gifIdx=(gifIdx+1)%GIF_FRAMES.length;perrito.src=GIF_FRAMES[gifIdx];}setInterval(walk,1000);function perritoClick(){barkRandom();var bx=Math.min(px+10,section.offsetWidth-190);bubble.style.left=Math.max(0,bx)+"px";bubble.textContent=frases[Math.floor(Math.random()*frases.length)];bubble.style.opacity="1";setTimeout(function(){bubble.style.opacity="0";},2000);}function barkRandom(){var i;do{i=Math.floor(Math.random()*BARKS.length);}while(i===lastBark);lastBark=i;try{var au=new Audio(BARKS[i]);au.volume=0.5;au.play();}catch(e){}}
(function(){var canvas=document.getElementById("fw-canvas");var ctx=canvas.getContext("2d");function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}resize();window.addEventListener("resize",resize);var COLORS=["#FF6B00","#FFC107","#FF3366","#00E5FF","#B2FF59","#EA80FC","#FFD740","#fff","#FF6E40","#69F0AE"];var sparks=[];function spiralBurst(cx,cy){var c1=COLORS[Math.floor(Math.random()*COLORS.length)],c2=COLORS[Math.floor(Math.random()*COLORS.length)];var arms=3+Math.floor(Math.random()*3),total=120+Math.floor(Math.random()*60),d=Math.random()<0.5?1:-1;for(var i=0;i<total;i++){var t=i/total,arm=i%arms,angle=(arm/arms)*Math.PI*2+d*t*Math.PI*4,speed=1.5+t*5.5;sparks.push({x:cx,y:cy,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,color:t<0.3?c2:c1,alpha:1,size:0.5+Math.random(),gravity:0.05+Math.random()*0.03,decay:0.006+Math.random()*0.007,trail:[],bounced:false});}for(var k=0;k<20;k++){var a=(k/20)*Math.PI*2;sparks.push({x:cx,y:cy,vx:Math.cos(a)*1.5,vy:Math.sin(a)*1.5,color:"#ffffcc",alpha:1,size:1.1,gravity:0.015,decay:0.025,trail:[],bounced:false});}}var launches=0;var maxL=18;function launchNext(){if(launches>=maxL)return;spiralBurst(canvas.width*0.08+Math.random()*canvas.width*0.84,canvas.height*(0.05+Math.random()*0.28));launches++;if(launches<maxL)setTimeout(launchNext,180+Math.random()*280);}launchNext();var gs=[];function loop(){ctx.clearRect(0,0,canvas.width,canvas.height);var fy=canvas.height*0.92;for(var i=sparks.length-1;i>=0;i--){var s=sparks[i];s.trail.push({x:s.x,y:s.y});if(s.trail.length>10)s.trail.shift();s.x+=s.vx;s.y+=s.vy;s.vy+=s.gravity;s.vx*=0.987;s.alpha-=s.decay;if(s.alpha<=0){sparks.splice(i,1);continue;}if(!s.bounced&&s.y>=fy){s.bounced=true;s.vy=-Math.abs(s.vy)*0.25;s.vx*=0.3;s.alpha*=0.4;gs.push({x:s.x,y:fy,vx:(Math.random()-0.5)*2.5,vy:-Math.random()*1.2,alpha:s.alpha,color:s.color,size:0.5,decay:0.06});}if(s.trail.length>1){ctx.beginPath();ctx.moveTo(s.trail[0].x,s.trail[0].y);for(var t=1;t<s.trail.length;t++)ctx.lineTo(s.trail[t].x,s.trail[t].y);ctx.strokeStyle=s.color;ctx.globalAlpha=s.alpha*0.45;ctx.lineWidth=s.size*0.5;ctx.stroke();}ctx.globalAlpha=s.alpha;ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fill();}for(var i=gs.length-1;i>=0;i--){var g=gs[i];g.x+=g.vx;g.y+=g.vy;g.vy+=0.05;g.alpha-=g.decay;if(g.alpha<=0){gs.splice(i,1);continue;}ctx.globalAlpha=g.alpha;ctx.fillStyle=g.color;ctx.beginPath();ctx.arc(g.x,g.y,g.size,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;if(sparks.length>0||gs.length>0||launches<maxL)requestAnimationFrame(loop);else ctx.clearRect(0,0,canvas.width,canvas.height);}loop();})();
cargarProductos();
</script>

<button class="btn-regresar" onclick="document.querySelector('.sidebar')?.scrollIntoView({behavior:'smooth'})">
  ← Categorías
